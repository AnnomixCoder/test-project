<form action="/submit-form" method="POST" style="max-width: 400px; margin: 40px auto; padding: 24px; background-color: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; font-family: Arial, sans-serif;">

  <!-- Text Input for Name -->
  <label for="name" style="font-weight: bold; display: block; margin-bottom: 4px;">Name:</label>
  <input type="text" id="name" name="name" required
    style="width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 16px;">

  <!-- Email Input -->
  <label for="email" style="font-weight: bold; display: block; margin-bottom: 4px;">Email:</label>
  <input type="email" id="email" name="email" required
    style="width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 16px;">

  <!-- Message Area -->
  <label for="message" style="font-weight: bold; display: block; margin-bottom: 4px;">Message:</label>
  <textarea id="message" name="message" rows="4" cols="30"
    style="width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical; margin-bottom: 16px;"></textarea>

  <!-- Remarks Area -->
  <label for="remarks" style="font-weight: bold; display: block; margin-bottom: 4px;">Remarks:</label>
  <textarea id="remarks" name="remarks" rows="3" cols="30"
    style="width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical; margin-bottom: 20px;"></textarea>

  <!-- Submit Button -->
  <button type="submit"
    style="background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%;">
    Submit
  </button>


    <!-- reset Button -->
  <button type="reset"
    style="background-color: #5448c4; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%;">
    Submit
  </button>
</form>
